<section class="quick container">

    <!-- Límite de hoy (se llena con JavaScript) -->
    <div id="heroHoy"></div>

    <div class="quick-head">
        <h2>Nuevo gasto</h2>
        <p>Regístralo en segundos.</p>
    </div>

    <form id="formGastoRapido" class="quick-card">

        <div class="mb-3">
            <label class="form-label" for="qNombre">Nombre</label>
            <input type="text" id="qNombre" class="form-control" maxlength="150"
                   placeholder="Ej. Tacos, gasolina, renta" autocomplete="off" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="qCategoria">Categoría</label>
            <select id="qCategoria" class="form-select">
                <option value="">Sin categoría</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="qTotal">Total</label>
            <div class="input-group total-wrap">
                <span class="input-group-text">$</span>
                <input type="number" id="qTotal" class="form-control" inputmode="decimal"
                       step="0.01" min="0" max="99999999.99" placeholder="0.00" required>
            </div>
        </div>

        <!-- Campos opcionales -->
        <button type="button" id="btnDetalles" class="btn-detalles"
                aria-expanded="false" aria-controls="qDetalles">
            <span class="mas">+</span><span class="txt">Agregar más detalles</span>
        </button>

        <div id="qDetalles" class="d-none mt-3">
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label" for="qCantidad">Cantidad</label>
                    <input type="number" id="qCantidad" class="form-control" inputmode="decimal"
                           step="0.01" min="0" max="99999999.99">
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label" for="qPrecio">Precio</label>
                    <input type="number" id="qPrecio" class="form-control" inputmode="decimal"
                           step="0.01" min="0" max="99999999.99">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="qDescripcion">Descripción</label>
                <input type="text" id="qDescripcion" class="form-control" maxlength="255">
            </div>
        </div>

        <button type="submit" id="btnGuardar" class="btn btn-success btn-guardar w-100 mt-3">
            Guardar gasto
        </button>
    </form>
</section>
